<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sewa Office — Nice Koppi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --page:#FFF6DA;
    --surface:#FFFFFF;
    --surface-2:#FDECAF;
    --ink:#2B1B0E;
    --muted:#8A7040;
    --gold:#F2B705;
    --gold-deep:#B9860B;
    --rust:#A85D00;
    --cream:#FFF8E2;
    --line:#F0DFA0;
    --radius:18px;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--page); color:var(--ink);
    font-family:"Plus Jakarta Sans",sans-serif;
    background-image:
      radial-gradient(circle at 15% 0%, rgba(245,197,24,.20), transparent 40%),
      radial-gradient(circle at 90% 20%, rgba(184,93,0,.12), transparent 45%);
  }
  .wrap{ max-width:1180px; margin:0 auto; padding:0 28px; }
  a{ color:inherit; }

  /* ---------- HERO ---------- */
  .hero{ padding:76px 28px 48px; text-align:center; }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-family:"IBM Plex Mono",monospace; font-size:12.5px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--gold-deep);
    border:1px dashed var(--gold-deep); border-radius:999px; padding:7px 16px;
    background:rgba(242,183,5,.14);
  }
  .eyebrow .dot{ width:6px; height:6px; border-radius:50%; background:var(--gold); box-shadow:0 0 0 3px rgba(242,183,5,.25); }
  h1{
    font-family:"Fraunces",serif; font-weight:600; font-size:clamp(34px,5.5vw,58px);
    line-height:1.05; margin:22px 0 14px; letter-spacing:-.01em;
  }
  h1 em{ font-style:italic; font-weight:500; color:var(--rust); }
  .hero p{ max-width:560px; margin:0 auto; color:var(--muted); font-size:16px; line-height:1.65; }

  /* ---------- GRID ---------- */
  #app{ padding:8px 28px 100px; }
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:26px; max-width:1180px; margin:0 auto;
  }

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    overflow:hidden; display:flex; flex-direction:column;
    box-shadow:0 18px 34px -22px rgba(120,86,10,.35);
  }

  /* photo + stamp */
  .photo-btn{ all:unset; cursor:pointer; display:block; position:relative; }
  .photo{
    position:relative; height:190px; width:100%;
    background:linear-gradient(135deg,var(--photo-a,#F2B705),var(--photo-b,#8A5E00));
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .photo img{ width:100%; height:100%; object-fit:cover; }
  .photo .grain{
    position:absolute; inset:0;
    background:radial-gradient(circle at 30% 20%, rgba(255,255,255,.10), transparent 55%);
  }
  .stamp{
    position:absolute; top:12px; left:12px; width:58px; height:58px; border-radius:50%;
    border:1.5px dashed var(--cream); color:var(--cream);
    display:flex; align-items:center; justify-content:center; text-align:center;
    transform:rotate(-9deg); font-family:"IBM Plex Mono",monospace;
    background:rgba(33,22,16,.42); backdrop-filter:blur(1px);
    font-size:11px; line-height:1.15; letter-spacing:.02em;
  }
  .stack-badge{
    position:absolute; bottom:10px; right:10px;
    font-family:"IBM Plex Mono",monospace; font-size:11px;
    background:rgba(33,22,16,.55); color:var(--cream);
    padding:4px 9px; border-radius:999px; border:1px solid rgba(244,233,214,.25);
  }
  .zoom-hint{
    position:absolute; inset:0; display:flex; align-items:flex-end; justify-content:center;
    padding-bottom:14px; opacity:0; transition:opacity .18s ease;
    background:linear-gradient(180deg, transparent 40%, rgba(20,13,9,.55));
    font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--cream);
  }
  .photo-btn:hover .zoom-hint{ opacity:1; }

  /* body */
  .body{ padding:20px 20px 22px; display:flex; flex-direction:column; gap:10px; }
  .name-row{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .name{ font-family:"Fraunces",serif; font-weight:600; font-size:19px; }
  .size-tag{
    font-family:"IBM Plex Mono",monospace; font-size:12.5px; color:var(--gold-deep);
    white-space:nowrap;
  }
  .loc{ font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .desc{ font-size:13.5px; color:var(--muted); line-height:1.55; }

  .tear{
    border-top:1.5px dashed var(--line); margin-top:4px; padding-top:14px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .price-block{ display:flex; flex-direction:column; }
  .price-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); }
  .price{ font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:17px; color:var(--ink); }
  .price span{ font-size:11px; color:var(--muted); font-weight:400; }

  .cta{
    display:inline-flex; align-items:center; gap:7px; white-space:nowrap;
    background:var(--rust); color:var(--cream); text-decoration:none;
    padding:10px 16px; border-radius:999px; font-size:13.5px; font-weight:600;
    transition:opacity .15s ease;
  }
  .cta:hover{ opacity:.86; }

  /* ---------- MODAL ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(15,10,7,.82); backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; z-index:100;
    opacity:0; pointer-events:none; transition:opacity .18s ease; padding:24px;
  }
  .modal-overlay.open{ opacity:1; pointer-events:auto; }
  .modal{
    background:var(--surface); border:1px solid var(--line); border-radius:20px;
    max-width:640px; width:100%; overflow:hidden;
  }
  .modal-slides{ position:relative; height:380px; background:var(--surface-2); }
  .slide{
    position:absolute; inset:0; opacity:0; transition:opacity .25s ease;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,var(--photo-a,#F2B705),var(--photo-b,#8A5E00));
  }
  .slide.active{ opacity:1; }
  .slide img{ width:100%; height:100%; object-fit:cover; }
  .modal-close{
    position:absolute; top:14px; right:14px; width:34px; height:34px; border-radius:50%;
    background:rgba(15,10,7,.55); color:var(--cream); display:flex; align-items:center;
    justify-content:center; cursor:pointer; z-index:2; font-size:15px;
  }
  .modal-nav{
    position:absolute; top:50%; transform:translateY(-50%); width:38px; height:38px;
    border-radius:50%; background:rgba(15,10,7,.55); color:var(--cream);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    font-size:20px; z-index:2; user-select:none;
  }
  .modal-nav.prev{ left:14px; } .modal-nav.next{ right:14px; }
  .dots{
    position:absolute; bottom:14px; left:0; right:0; display:flex; gap:6px;
    justify-content:center; z-index:2;
  }
  .dots span{ width:6px; height:6px; border-radius:50%; background:rgba(244,233,214,.35); }
  .dots span.active{ background:var(--cream); width:18px; border-radius:4px; }
  .modal-info{ padding:18px 22px 22px; display:flex; align-items:center; justify-content:space-between; gap:14px; }
  .modal-info h4{ font-family:"Fraunces",serif; font-weight:600; font-size:18px; margin:0; }
  .modal-info .price{ font-family:"IBM Plex Mono",monospace; color:var(--gold-deep); font-size:15px; }

  footer{ padding:36px 28px 60px; text-align:center; }
  .note{
    max-width:640px; margin:0 auto 18px; font-size:12.5px; color:var(--muted);
    border:1px dashed var(--line); border-radius:14px; padding:14px 18px; text-align:left;
  }
  .note code{ background:var(--surface-2); padding:1px 5px; border-radius:4px; }
  footer .credit{ font-size:12px; color:var(--muted); }

  @media (max-width:520px){
    .modal-slides{ height:260px; }
  }
</style>
</head>
<body>

<div class="wrap hero">
  <span class="eyebrow"><span class="dot"></span>Nice Koppi · Ruang Kerja Disewakan</span>
  <h1>Sewa <em>Office</em> Nice Koppi</h1>
  <p>Pilih ruang kerja yang cocok untuk tim Anda — dari bilik privat hingga ruang kolaborasi terbuka, lengkap dengan ukuran, harga sewa, dan foto ruangan.</p>
</div>

<div class="wrap" id="app"></div>

<footer class="wrap">
  <div class="credit">Sewa Office Nice Koppi · katalog ruang kerja internal</div>
</footer>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-slides" id="modalSlides">
      <div class="modal-close" id="modalClose">✕</div>
      <div class="modal-nav prev" id="modalPrev">‹</div>
      <div class="modal-nav next" id="modalNext">›</div>
      <div class="dots" id="modalDots"></div>
    </div>
    <div class="modal-info">
      <h4 id="modalName"></h4>
      <span class="price" id="modalPrice"></span>
    </div>
  </div>
</div>

<script>
// ---------- DATA ----------
// Tiap ruangan punya minimal 3 slot "photos" untuk carousel (di sini disiapkan 4).
// Isi string kosong "" dengan path foto Anda, contoh "foto/eksekutif-1.jpg".
const DATA = [
  {
    name:"Beleza Permata Hijau", size:"12 m²", capacity:"4 orang",
    price:"Rp 6.300.000", period:"/ bulan", loc:"Permata Hijau",
    desc:"Ruang privat dengan meja rapat kecil, cocok untuk tim inti atau meeting klien.",
    pa:"#F2B705", pb:"#8A5E00",
    photos:["beleza1.jpg","beleza2.jpg","beleza3.jpg",""],
    wa:"https://maps.app.goo.gl/PLJEW61KaJi2i3AW9"
  },
  {
    name:"Graha pena Kebayoran", size:"20 m²", capacity:"8 orang",
    price:"Rp 4.662.000", period:"/ bulan", loc:"Kebayoran",
    desc:"Suasana terbuka dengan pencahayaan alami, pas untuk tim desain dan brainstorming.",
    pa:"#F7C948", pb:"#B9860B",
    photos:["pena1.jpg","pena2.jpeg","",""],
    wa:"https://maps.app.goo.gl/n9SKTXvBchji9DuQA"
  },
  {
    name:"Ruko Jalan Panjang", size:"10 Pax", capacity:"10 orang",
    price:"Rp 5.800.000", period:"/ bulan", loc:"Arteri",
    desc:"Bilik tertutup untuk kerja fokus, dilengkapi meja, kursi ergonomis, dan colokan listrik.",
    pa:"#F5C518", pb:"#7A5200",
    photos:["jlp1.jpg","foto/bilik-2.jpg","foto/bilik-3.jpg",""],
    wa:"https://maps.app.goo.gl/JMLdf2DHfo5UoozY7"
  },
  {
    name:"Ruko Jalan Panjang 2", size:"8 Pax", capacity:"8 orang",
    price:"Rp 4.103.000", period:"/ hari", loc:"arteri",
    desc:"Dilengkapi layar presentasi dan papan tulis, ideal untuk rapat internal atau klien.",
    pa:"#FAD35C", pb:"#A66F00",
    photos:["jpl2.jpg","foto/meeting-2.jpg","foto/meeting-3.jpg",""],
    wa:"https://maps.app.goo.gl/JMLdf2DHfo5UoozY7"
  },
  {
    name:"Menara Citi Bank", size:"4 Pax", capacity:"4 orang",
    price:"Rp 7.200.000", period:"/ bulan", loc:"Pondok Indah",
    desc:"Area terbuka dengan meja komunal, cocok untuk tim yang butuh ruang fleksibel.",
    pa:"#F3BE1E", pb:"#8F5D02",
    photos:["pi1.jpg","foto/openspace-2.jpg","foto/openspace-3.jpg",""],
    wa:"https://maps.app.goo.gl/omWDWAf7CEb3j6Hz9"
  },
  {
    name:"Ruko Kemanggisan", size:"6 pax", capacity:"6 orang",
    price:"Rp 6.000.000", period:"/ bulan", loc:"Kemanggisan",
    desc:"Ruang kedap suara dengan peredam akustik, bisa dipakai rapat maupun rekaman.",
    pa:"#F8D77A", pb:"#96650A",
    photos:["kemanggisan1.jpeg","kemanggisan2.jpg","foto/studio-3.jpg",""],
    wa:"https://maps.app.goo.gl/S3CujeyRHRnxsAyBA"
  },
];

// ---------- HELPERS ----------
function pinIcon(){
  return `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0Z"/><circle cx="12" cy="10" r="3"/></svg>`;
}
function locationLink(room){
  const query = room.mapsQuery || `${room.name} ${room.loc}`;
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
}
function cardHTML(room){
  const photos = room.photos || [];
  const firstPhoto = photos[0] || "";
  const thumbInner = firstPhoto ? `<img src="${firstPhoto}" alt="${room.name}" loading="lazy">` : "";
  const modalPayload = { name:room.name, price:room.price, period:room.period, pa:room.pa, pb:room.pb, photos };
  return `
  <div class="card">
    <button class="photo-btn" onclick='openModal(${JSON.stringify(modalPayload).replace(/'/g,"&apos;")})'>
      <div class="photo" style="--photo-a:${room.pa};--photo-b:${room.pb}">
        ${thumbInner}
        <div class="grain"></div>
        <div class="stamp">${room.size}<br>${room.capacity}</div>
        <span class="stack-badge">📷 1/${photos.length}</span>
        <span class="zoom-hint">Lihat ${photos.length} foto →</span>
      </div>
    </button>
    <div class="body">
      <div class="name-row">
        <span class="name">${room.name}</span>
        <span class="size-tag">${room.size}</span>
      </div>
      <span class="loc">${pinIcon()} ${room.loc}</span>
      <p class="desc">${room.desc}</p>
      <div class="tear">
        <div class="price-block">
          <span class="price-label">Harga sewa</span>
          <span class="price">${room.price} <span>${room.period}</span></span>
        </div>
        <a class="cta" href="${locationLink(room)}" target="_blank" rel="noopener">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          Lihat Lokasi
        </a>
      </div>
    </div>
  </div>`;
}

// ---------- RENDER ----------
const app = document.getElementById("app");
let grid = document.createElement("div");
grid.className = "grid";
DATA.forEach(room=>{ grid.innerHTML += cardHTML(room); });
app.appendChild(grid);

// ---------- MODAL / CAROUSEL ----------
const overlay = document.getElementById("modalOverlay");
const slidesWrap = document.getElementById("modalSlides");
const dotsWrap = document.getElementById("modalDots");
const modalName = document.getElementById("modalName");
const modalPrice = document.getElementById("modalPrice");
let curSlide = 0, totalSlides = 3;

function openModal(data){
  modalName.textContent = data.name;
  modalPrice.textContent = `${data.price} ${data.period}`;
  curSlide = 0;
  const photos = data.photos || [];
  totalSlides = photos.length || 3;

  let slidesHTML = "";
  for(let i=0;i<totalSlides;i++){
    const src = photos[i] || "";
    const inner = src ? `<img src="${src}" alt="${data.name}">` : "";
    slidesHTML += `<div class="slide ${i===0?'active':''}" style="--photo-a:${data.pa};--photo-b:${data.pb}" data-i="${i}">${inner}</div>`;
  }
  slidesWrap.querySelectorAll(".slide").forEach(s=>s.remove());
  slidesWrap.insertAdjacentHTML("afterbegin", slidesHTML);

  dotsWrap.innerHTML = "";
  for(let i=0;i<totalSlides;i++){
    dotsWrap.innerHTML += `<span class="${i===0?'active':''}"></span>`;
  }

  overlay.classList.add("open");
}
function showSlide(i){
  const slides = slidesWrap.querySelectorAll(".slide");
  const dots = dotsWrap.querySelectorAll("span");
  curSlide = (i + totalSlides) % totalSlides;
  slides.forEach((s,idx)=>s.classList.toggle("active", idx===curSlide));
  dots.forEach((d,idx)=>d.classList.toggle("active", idx===curSlide));
}
document.getElementById("modalPrev").addEventListener("click", ()=>showSlide(curSlide-1));
document.getElementById("modalNext").addEventListener("click", ()=>showSlide(curSlide+1));
document.getElementById("modalClose").addEventListener("click", ()=>overlay.classList.remove("open"));
overlay.addEventListener("click", ()=>overlay.classList.remove("open"));

let touchStartX = 0;
slidesWrap.addEventListener("touchstart", e=>{ touchStartX = e.changedTouches[0].screenX; });
slidesWrap.addEventListener("touchend", e=>{
  const dx = e.changedTouches[0].screenX - touchStartX;
  if(Math.abs(dx) > 40) showSlide(curSlide + (dx < 0 ? 1 : -1));
});

document.addEventListener("keydown", e=>{
  if(!overlay.classList.contains("open")) return;
  if(e.key==="Escape") overlay.classList.remove("open");
  if(e.key==="ArrowRight") showSlide(curSlide+1);
  if(e.key==="ArrowLeft") showSlide(curSlide-1);
});
</script>
</body>
</html>
